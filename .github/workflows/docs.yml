name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - ".markdownlint.yml"
      - ".github/workflows/docs.yml"

jobs:
  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CHANGELOG.md
            docs/**/*.md

  links:
    name: Check Local Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # 仅检查本地相对链接，忽略外链（--offline 不发起网络请求）
          args: --offline --no-progress "README.md" "CONTRIBUTING.md" "CHANGELOG.md" "docs/**/*.md"
          fail: true
