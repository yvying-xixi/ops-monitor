name: ops-monitor

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_DATABASE: ${DB_NAME:-ops_monitor}
    volumes:
      - ${DATA_VOLUME_DIR:-../data}/mysql:/var/lib/mysql
      # Schema 由 backend 容器启动时执行 `alembic upgrade head` 创建（见 backend/entrypoint.sh）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    volumes:
      - ${DATA_VOLUME_DIR:-../data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops-net]

  backend:
    image: ${BACKEND_IMAGE:-ops-monitor-backend:local}
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *default-logging
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-ops_monitor}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      SEED_INIT_DATA: ${SEED_INIT_DATA:-true}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-7}
      TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-30}
      OPERATION_LOG_ENABLED: ${OPERATION_LOG_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AGENT_REQUIRE_SIGNATURE: ${AGENT_REQUIRE_SIGNATURE:-false}
      AGENT_SIGNATURE_MAX_SKEW: ${AGENT_SIGNATURE_MAX_SKEW:-300}
      SCHEDULER_LOCK_ENABLED: ${SCHEDULER_LOCK_ENABLED:-true}
      SCHEDULER_LOCK_TTL_SECONDS: ${SCHEDULER_LOCK_TTL_SECONDS:-600}
      CORS_ORIGINS: '${CORS_ORIGINS:-["*"]}'
      AGENT_BUNDLE_DIR: /opt/agent-bundle
    volumes:
      # 供 /api/v1/agent/package 打包下载（只读挂载仓库中的 agent 源码/二进制与 systemd 模板）
      - ../../agent:/opt/agent-bundle/agent:ro
      - ../../agent-go:/opt/agent-bundle/agent-go:ro
      - ../../deploy/systemd:/opt/agent-bundle/deploy/systemd:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ops-net]

  nginx:
    image: ${NGINX_IMAGE:-ops-monitor-frontend:local}
    build:
      context: ../..
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../../deploy/nginx/certs:/etc/nginx/certs:ro
      - ../../deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [ops-net]

networks:
  ops-net:
    driver: bridge
