name: ops-monitor

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_DATABASE: ${DB_NAME:-ops_monitor}
    volumes:
      - ${DATA_VOLUME_DIR:-../data}/mysql:/var/lib/mysql
      # 首启自动执行建表脚本（含 CREATE DATABASE IF NOT EXISTS）
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    volumes:
      - ${DATA_VOLUME_DIR:-../data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ops-net]

  backend:
    image: ${BACKEND_IMAGE:-ops-monitor-backend:local}
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-ops_monitor}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      SEED_INIT_DATA: ${SEED_INIT_DATA:-true}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-7}
      OPERATION_LOG_ENABLED: ${OPERATION_LOG_ENABLED:-true}
      CORS_ORIGINS: '${CORS_ORIGINS:-["*"]}'
      AGENT_BUNDLE_DIR: /opt/agent-bundle
    volumes:
      # 供 /api/v1/agent/package 打包下载（只读挂载仓库中的 agent 源码与 systemd 模板）
      - ../../agent:/opt/agent-bundle/agent:ro
      - ../../deploy/systemd:/opt/agent-bundle/deploy/systemd:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ops-net]

  nginx:
    image: ${NGINX_IMAGE:-ops-monitor-nginx:local}
    build:
      context: ../..
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../../deploy/nginx/certs:/etc/nginx/certs:ro
      - ../../deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
    networks: [ops-net]

networks:
  ops-net:
    driver: bridge
